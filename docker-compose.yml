services:
  db:
    image: postgres:16-alpine
    container_name: financiamento-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: financiamento
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d financiamento"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
